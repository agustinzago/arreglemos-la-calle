<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:hsl(220 16% 88%)}a{color:hsl(226 75% 32%)}a:hover{color:hsl(226 72% 40%)}</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px 20px;font-family:system-ui,sans-serif;color:hsl(224 32% 12%)">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:4px 16px;font-size:14px;line-height:1.4;text-align:center">
    <b>Arreglemos la Calle · prototipo navegable</b>
    <span style="color:hsl(222 12% 34%)">Tocá "Sacar foto" para recorrer el flujo completo</span>
    <a href="Canvas.dc.html">Ver todas las pantallas</a>
  </div>
  <div style="position:relative;width:{{ boxW }};height:{{ boxH }}">
    <div style="position:absolute;left:0;top:0;transform-origin:top left;transform:scale({{ scale }})">
      <sc-if value="{{ ios }}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="390px" height="844px" dark="{{ sbDark }}" bg="{{ bg }}" hint-size="390px,844px">
          <dc-import name="App" screen="{{ start }}" theme="{{ theme }}" font-scale="{{ fs }}" platform="ios" offline="{{ offline }}" on-screen="{{ onScreen }}" hint-size="100%,100%" style="display:block;height:100%"></dc-import>
        </x-import>
      </sc-if>
      <sc-if value="{{ android }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" width="428px" height="931px" dark="{{ sbDark }}" bg="{{ bg }}" hint-size="428px,931px">
          <dc-import name="App" screen="{{ start }}" theme="{{ theme }}" font-scale="{{ fs }}" platform="android" offline="{{ offline }}" on-screen="{{ onScreen }}" hint-size="100%,100%" style="display:block;height:100%"></dc-import>
        </x-import>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ios&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;tsType&quot;:&quot;'ios'|'android'&quot;,&quot;section&quot;:&quot;Dispositivo&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Dispositivo&quot;},&quot;fontScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;1&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;1.5&quot;,&quot;2&quot;],&quot;tsType&quot;:&quot;'1'|'1.5'|'2'&quot;,&quot;section&quot;:&quot;Dispositivo&quot;},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flujo&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;camara&quot;,&quot;options&quot;:[&quot;permisos&quot;,&quot;camara&quot;,&quot;ubicacion&quot;,&quot;categoria&quot;,&quot;duplicados&quot;,&quot;detalles&quot;,&quot;confirmacion&quot;,&quot;mapa&quot;,&quot;detalle&quot;,&quot;mis&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Flujo&quot;}}">
class Component extends DCLogic {
  state = { screen: 'camara', vw: window.innerWidth, vh: window.innerHeight };
  onScreen = s => { if (s !== this.state.screen) this.setState({ screen: s }); };
  componentDidMount() {
    this.onR = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
    window.addEventListener('resize', this.onR);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const p = this.props, android = p.platform === 'android', dark = p.theme === 'dark';
    const W = android ? 428 : 390, H = android ? 931 : 844;
    const scale = Math.max(0.4, Math.min(1, (this.state.vh - 90) / H, (this.state.vw - 24) / W));
    const cam = this.state.screen === 'camara';
    return {
      ios: !android, android, theme: dark ? 'dark' : 'light', fs: String(p.fontScale || '1'),
      start: p.startScreen || 'camara', offline: !!p.offline, onScreen: this.onScreen,
      sbDark: dark || cam, bg: cam ? '#0b0d12' : dark ? 'hsl(224 24% 8%)' : 'hsl(220 20% 96%)',
      scale, boxW: W * scale + 'px', boxH: H * scale + 'px',
    };
  }
}

</script>
</body>
</html>
